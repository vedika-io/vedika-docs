name: root-file-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deny-root-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a denied file is at the repository root
        run: |
          status=0
          for name in LEAK-SCAN-REPORT.md PUSH-CHECKLIST.md MANIFEST.md; do
            if ls -1 | grep -qix "$name"; then
              echo "::error::$name must not be present at the repository root"
              status=1
            fi
          done
          exit $status
